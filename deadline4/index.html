<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline 4</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="banner">
      <h1 style="font-size: 24;">Jackson</h1>
      <div class="divider"></div>
      <h2 style="font-size: 24;">Electronics</h2>
    </div>
    <h3 class="h3">Registration Form</h3>
    <p class="caption">Register your Jackson Electronics product here</p>
    <form>
      <table>
        <tr>
          <td>First Name:</td>
          <td>
            <input size="12" type="text" name="First name" style="margin-left: 10%;">
            Last Name:
            <input size="12" type="text" name="Last name">
          </td>
        </tr>
        <tr>
          <td>Address #1</td>
          <td><input type="text" name="Address1" style="margin-left: 10%;"></td>
        </tr>
        <tr>
          <td>Address #2</td>
          <td><input type="text" name="Address2" style="margin-left: 10%;"></td>
        </tr>
        <tr>
          <td>City:</td>
          <td>
            <input size="14" type="text" name="city" style="margin-left: 10%;">
            State:<input type="text" name="state" style="width:40px;">
            Zip:<input type="text" name="zip" style="width: 60px;">
          </td>
        </tr>
        <tr class="Country">
          <td>Country:</td>
          <td><input type="text" name="Country" value="United States" style="margin-left: 10%;"></td>
        </tr>
        <tr>
          <td colspan="2">
            <hr>
          </td>
        </tr>
        <tr>
          <td>Product</td>
          <td>
            <select name="product" style="margin-left: 10%;">
              <option value="">ScanMaster</option>
              <option value="">Con vit vang 2</option>
              <option value="">Con vit vang 3</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Date Purchased:</td>
          <td><input type="text" name="Date Purchased" style="margin-left: 10%;"></td>
        </tr>
        <tr>
          <td>Serial #:</td>
          <td><input type="text" name="Serial" style="margin-left: 10%;"></td>
        </tr>
        <tr>
          <td style="vertical-align: top;">Used for:</td>
          <td>
            <input type="radio" id="usedfor1" name="usedfor" style="margin-left: 10%;">
            <label class="button" for="usedfor1">Home</label>
            <input type="radio" id="usedfor2" name="usedfor">
            <label class="button" for="usedfor2">Educational Institution</label><br>
            <input type="radio" id="usedfor3" name="usedfor" style="margin-left: 10%;">
            <label class="button" for="usedfor3">Business</label>
            <input type="radio" id="usedfor4" name="usedfor">
            <label class="button" for="usedfor4">Other</label><br>
            <input type="radio" id="usedfor5" name="usedfor" style="margin-left: 10%;">
            <label class="button" for="usedfor5">Govemment</label>
          </td>
        </tr>
        <tr>
          <td style="vertical-align: top;">System (check all that apply):</td>
          <td>
            <input type="checkbox" id="st1" name="st" style="margin-left: 10%;">
            <label class="button" for="st1">Windows</label>
            <input type="checkbox" id="st2" name="st">
            <label class="button" for="st2">UNIX</label><br>
            <input type="checkbox" id="st3" name="st" style="margin-left: 10%;">
            <label class="button" for="st3">Macintosh</label>
            <input type="checkbox" id="st4" name="st">
            <label class="button" for="st4">Other</label>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <hr>
          </td>
        </tr>
        <tr>
          <td style="vertical-align: top;">Comments?:</td>
          <td><textarea class="con_vit_vang_5" name="Comments"></textarea></td>
        </tr>
        <tr>
          <td colspan="2">
            <div class="con_vit_vang_4">
              <input type="submit" value="Click to register">
              <input type="reset" value="Click to cancel">
            </div>

          </td>
        </tr>
      </table>
  </div>
</body>

</html>
